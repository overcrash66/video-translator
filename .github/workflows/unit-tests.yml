name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ===========================================================================
  # SMOKE TESTS — Multi-platform validation
  # ===========================================================================
  smoke-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ffmpeg

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install ffmpeg -y

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip "setuptools<70.0.0" wheel
        pip install "numpy<2.0.0" cython
        pip install -r tests/requirements-test.txt

    - name: Run smoke tests
      env:
        CI: "true"
      run: |
        pytest tests/test_smoke_install.py -m smoke -v --tb=short

    - name: Run pipeline smoke tests
      env:
        CI: "true"
      run: |
        pytest tests/test_smoke_pipeline.py -m smoke -v --tb=short

  # ===========================================================================
  # UNIT TESTS — Full test suite with mocked heavy deps
  # ===========================================================================
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true
        docker-images: false

    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip "setuptools<70.0.0" wheel
        pip install "numpy<2.0.0" cython
        pip install -r tests/requirements-test.txt

    - name: Run unit tests
      env:
        CI: "true"
      run: |
        pytest tests/ -v --tb=short -m "not gpu and not requires_models" --ignore=tests/test_smoke_install.py
